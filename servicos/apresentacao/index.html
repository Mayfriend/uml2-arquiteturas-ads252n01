<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Sistema Acadêmico</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 700px; margin: 30px auto; padding: 0 15px; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
    input, button { padding: 8px; margin: 4px 0; }
    .ok { color: green; font-weight: bold; }
    .erro { color: red; font-weight: bold; }
  </style>
</head>
<body>
  <h1>Sistema Acadêmico</h1>

  <h2>Disciplinas disponíveis</h2>
  <table id="tabela">
    <thead><tr><th>Código</th><th>Disciplina</th><th>Vagas</th></tr></thead>
    <tbody></tbody>
  </table>

  <h2>Matrícula</h2>
  <!-- COMMIT 3: troque esta linha pelo formulário -->

  <script>
    const API = "http://localhost:5000";
    async function carregarDisciplinas() {
      const resp = await fetch(API + "/disciplinas");
      const disciplinas = await resp.json();
      const corpo = document.querySelector("#tabela tbody");
      corpo.innerHTML = "";
      for (const d of disciplinas) {
        corpo.innerHTML += `<tr><td>${d.id}</td><td>${d.nome}</td><td>${d.vagas}</td></tr>`;
      }
    }
    carregarDisciplinas();
    // COMMIT 3: troque esta linha pelas funções matricular e minhasMatriculas
  </script>
</body>
</html>
